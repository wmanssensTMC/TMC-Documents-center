# Runs on every push: engine tests (Python + LibreOffice + OCR on a clean Linux machine)
# and the web app build. Nothing needs to be installed on a laptop for this.
name: checks

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: System tools (LibreOffice, Tesseract, Ghostscript, poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer tesseract-ocr ghostscript poppler-utils
      - run: pip install -r requirements.txt
      - name: Route tests (synthetic documents)
        shell: bash
        run: |
          set +e
          python tests/test_v060_routes.py > routes.log 2>&1
          status=$?
          cat routes.log
          { echo "### Route tests (exit $status)"; echo '```'; tail -60 routes.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then
            msg=$(tail -40 routes.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Route tests::$msg"
          fi
          exit $status
      - name: Provenance gate blocks invented SDS values (skips without sample)
        run: python tests/test_sds_rejects_invented_values.py
      - name: Scan and batch tests (skips without samples)
        run: |
          python tests/test_scan_and_batches.py | tee scan.log
          ! grep -q "FAIL" scan.log

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere-000
